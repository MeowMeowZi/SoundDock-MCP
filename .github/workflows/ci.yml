name: Verify
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: sounddock-mcp-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
