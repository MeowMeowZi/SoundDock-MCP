name: Verify
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run pack
      - uses: actions/upload-artifact@v4
        with:
          name: sounddock-mcp-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sounddock-mcp-ubuntu-latest
          path: dist
      - name: Verify release version and checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          expected="v$(node --print "require('./package.json').version")"
          test "$RELEASE_TAG" = "$expected"
          cd dist
          sha256sum --check SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          cat > release-notes.md <<'NOTES'
          ## SoundDock MCP

          - Standalone local STDIO MCP for sound effects, BGM and narration.
          - Generated WAV / MP3 files are saved directly to the configured directory.
          - Durable request IDs, duplicate protection and conservative interrupted-job recovery.
          - Includes the AI installation guide, locked dependencies, examples and offline tests.

          Requires Node.js 24+ and the user's own audio-provider credentials.
          This is a local MCP package, not a hosted HTTP endpoint. Installation and self-check do not make paid audio requests.

          Download the ZIP and SHA256SUMS.txt, verify the checksum, then follow README.md inside the archive.
          NOTES
          gh release create "$RELEASE_TAG" \
            "dist/sounddock-mcp-$version.zip" \
            dist/SHA256SUMS.txt \
            --verify-tag \
            --title "SoundDock MCP $RELEASE_TAG" \
            --notes-file release-notes.md
